# Dependabot version updates. Security updates are enabled separately in
# Settings → Code security. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Keep workflow actions current (e.g. checkout/setup-python/artifact bumps).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Dev/test tooling pinned in requirements_test.txt.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 0.13.317+ requires Python 3.14 (current HA); this integration targets
      # Python 3.13 / min HA 2025.2. Re-enable after a deliberate 3.14 migration.
      - dependency-name: "pytest-homeassistant-custom-component"
