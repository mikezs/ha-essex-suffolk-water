name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires the icon to be merged into home-assistant/brands.
          ignore: brands
        env:
          # Lets the action read manifest.json / hacs.json via the GitHub API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
