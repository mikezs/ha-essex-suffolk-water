name: Release

# The manual entry point prepares a release using RELEASE_TOKEN so its pushes
# trigger CI and the tag publisher. Publishing itself uses GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      eswater_version:
        description: Re-pin eswater to a published stable version (blank keeps current)
        type: string
        default: ""
      dry_run:
        description: Validate the token and proposed release without pushing or publishing
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check branch and release token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "::error::Run releases from main"; exit 1; }
          test -n "$GH_TOKEN" || { echo "::error::Set the RELEASE_TOKEN Actions secret; see README.md"; exit 1; }
          actor=$(gh api user --jq .login)
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .permissions.push)" = true || { echo "::error::RELEASE_TOKEN needs Contents: read and write"; exit 1; }
          echo "Release token authenticated as $actor"
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prepare version and optional library pin
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          ESWATER_VERSION: ${{ inputs.eswater_version }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          stable = r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)"
          path = Path("custom_components/essex_suffolk_water/manifest.json")
          manifest = json.loads(path.read_text())
          current = manifest["version"]
          if not re.fullmatch(stable, current):
              raise SystemExit("Expected a stable MAJOR.MINOR.PATCH version")
          parts = list(map(int, current.split(".")))
          index = {"major": 0, "minor": 1, "patch": 2}[os.environ["BUMP"]]
          parts[index] += 1
          parts[index + 1:] = [0] * (2 - index)
          new = ".".join(map(str, parts))
          library = os.environ["ESWATER_VERSION"].strip()
          if library:
              if not re.fullmatch(stable, library):
                  raise SystemExit("eswater_version must be a stable MAJOR.MINOR.PATCH version")
              requirements = manifest["requirements"]
              matches = [i for i, requirement in enumerate(requirements) if requirement.startswith("eswater==")]
              if len(matches) != 1:
                  raise SystemExit("Expected exactly one eswater manifest pin")
              requirements[matches[0]] = f"eswater=={library}"
              tests = Path("requirements_test.txt")
              updated, count = re.subn(r"^eswater(?:==|>=)[^\n]+$", f"eswater=={library}", tests.read_text(), flags=re.M)
              if count != 1:
                  raise SystemExit("Expected exactly one eswater test requirement")
              tests.write_text(updated)
          manifest["version"] = new
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"new={new}\n")
          print(f"Prepared {current} -> {new}; requirements: {manifest['requirements']}")
          PY
      - name: Validate proposed release
        run: |
          pip install -r requirements_test.txt
          ruff check .
          mypy custom_components
          bandit -c pyproject.toml -r custom_components
          pytest -v --cov-fail-under=95
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare commit and verify push authentication
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          test -z "$(git tag --list "v$NEW_VERSION")" || { echo "::error::Release tag already exists"; exit 1; }
          git config user.name "mikezs"
          git config user.email "mikezs@users.noreply.github.com"
          git add custom_components/essex_suffolk_water/manifest.json requirements_test.txt
          git diff --cached --check
          git commit -m "Release $NEW_VERSION"
          git push --dry-run origin HEAD:main
      - name: Push release commit
        if: ${{ !inputs.dry_run }}
        run: git push origin HEAD:main
      - name: Wait for CI and HACS validation on the exact release commit
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for workflow in ci.yml validate.yml; do
            while true; do
              runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event push --branch main --commit "$sha" --json status,conclusion,url)
              status=$(jq -r '.[0].status // "pending"' <<< "$runs")
              if [ "$status" = completed ]; then
                test "$(jq -r '.[0].conclusion' <<< "$runs")" = success || { echo "::error::Release commit failed $workflow"; exit 1; }
                break
              fi
              sleep 10
            done
          done
      - name: Tag the checked release commit
        if: ${{ !inputs.dry_run }}
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
        run: |
          git tag -a "v$NEW_VERSION" -m "$NEW_VERSION"
          git push origin "refs/tags/v$NEW_VERSION"
      - name: Release summary
        env:
          NEW_VERSION: ${{ steps.version.outputs.new }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run passed for v$NEW_VERSION: token, proposed version, tests and HACS validation passed. No remote changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pushed v$NEW_VERSION after CI/Validate passed. The tag-triggered Release run will publish to GitHub." >> "$GITHUB_STEP_SUMMARY"
          fi
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify tag matches manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("custom_components/essex_suffolk_water/manifest.json").read_text())
          assert os.environ["GITHUB_REF_NAME"] == f"v{manifest['version']}"
          PY
      - name: Test integration
        run: |
          pip install -r requirements_test.txt
          ruff check .
          mypy custom_components
          bandit -c pyproject.toml -r custom_components
          pytest -v --cov-fail-under=95
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes
