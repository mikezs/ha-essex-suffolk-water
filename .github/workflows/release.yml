name: Release

# Commit the manifest version and library pin, wait for CI, then push vX.Y.Z.
# A tag-driven release avoids needing a personal token to write to main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify tag matches manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path("custom_components/essex_suffolk_water/manifest.json").read_text())
          assert os.environ["GITHUB_REF_NAME"] == f"v{manifest['version']}"
          PY
      - name: Test integration
        run: |
          pip install -r requirements_test.txt
          ruff check .
          mypy custom_components
          bandit -c pyproject.toml -r custom_components
          pytest -v --cov-fail-under=95
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes
