name: Release

# One-click release: pick a bump (and optionally a new eswater version to pin),
# and this updates manifest.json (+ requirements_test.txt), commits to main,
# tags, and cuts the GitHub release that HACS serves. Pushes use RELEASE_TOKEN
# (a fine-grained PAT owned by the repo admin) so they bypass the branch
# ruleset's required checks.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump (the integration's own version)
        type: choice
        options: [patch, minor, major]
        default: patch
      eswater_version:
        description: "Re-pin eswater to this version (leave blank to keep current)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "mikezs"
          git config user.email "mikezs@users.noreply.github.com"

      - name: Re-pin eswater (optional)
        if: ${{ inputs.eswater_version != '' }}
        run: |
          v="${{ inputs.eswater_version }}"
          sed -i -E "s/eswater==[0-9A-Za-z.\-]+/eswater==$v/" custom_components/essex_suffolk_water/manifest.json
          sed -i -E "s/^eswater>=.*/eswater>=$v/" requirements_test.txt
          grep -q "eswater==$v" custom_components/essex_suffolk_water/manifest.json

      - name: Compute new version
        id: ver
        run: |
          cur=$(python3 -c "import json; print(json.load(open('custom_components/essex_suffolk_water/manifest.json'))['version'])")
          IFS=. read -r MA MI PA <<< "$cur"
          case "${{ inputs.bump }}" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          new="$MA.$MI.$PA"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Bumping $cur -> $new"

      - name: Apply version
        run: |
          new="${{ steps.ver.outputs.new }}"
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1$new\2/" custom_components/essex_suffolk_water/manifest.json
          grep -q "\"version\": \"$new\"" custom_components/essex_suffolk_water/manifest.json
          python3 -c "import json; json.load(open('custom_components/essex_suffolk_water/manifest.json'))"

      - name: Commit, tag, push
        run: |
          new="${{ steps.ver.outputs.new }}"
          git add -A
          git commit -m "Release $new"
          git tag -a "v$new" -m "$new"
          git push origin HEAD:main
          git push origin "v$new"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: >
          gh release create "v${{ steps.ver.outputs.new }}"
          --title "${{ steps.ver.outputs.new }}"
          --generate-notes
