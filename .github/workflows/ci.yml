name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the test job only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test both the Python 3.13 baseline and current HA on Python 3.14.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy custom_components
      - name: Bandit
        run: bandit -c pyproject.toml -r custom_components
      - name: Pytest
        run: pytest -v --cov-fail-under=95

  minimum-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # This older plugin pins HA 2025.11.0 and librt 0.2.1, so keep the
      # modern mypy tooling in the main matrix rather than this environment.
      - name: Install minimum HA test environment
        run: |
          library=$(python -c "import json; print(next(r for r in json.load(open('custom_components/essex_suffolk_water/manifest.json'))['requirements'] if r.startswith('eswater==')))")
          pip install pytest-homeassistant-custom-component==0.13.294 'pycares<5' "$library"
      - name: Pytest
        run: pytest -v --cov-fail-under=95
