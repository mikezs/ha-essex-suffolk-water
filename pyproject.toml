[tool.ruff]
line-length = 100
target-version = "py313"
src = ["custom_components"]

[tool.ruff.lint]
# Curated, stricter-than-default set. Notably includes DTZ (this integration is
# timezone-heavy) and SLF/TRY/PL* to keep the error and boundary paths tidy.
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF",
    "A", "C4", "DTZ", "EM", "FLY", "FURB", "G", "ICN", "INP", "ISC",
    "LOG", "N", "PERF", "PGH", "PIE", "PLC", "PLE", "PLW", "PTH",
    "RET", "RSE", "SLF", "T20", "TID", "TRY",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # asserts are the point of a test
    "SLF001",  # tests legitimately poke coordinator internals
    "DTZ001",  # naive datetimes are fine in fixtures
    "PLW0603", # test globals
    "PERF401", # explicit fixture loops read more clearly
    "TRY003",  # test-helper assertion messages
    "EM102",   # ditto
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Home Assistant ships partial stubs; don't fail on its untyped internals.
follow_imports = "silent"
ignore_missing_imports = true
# HA's decorators/base classes are largely untyped, so under --strict every
# subclass method would otherwise be flagged as "explicit-any"/"untyped-call".
disallow_untyped_decorators = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.bandit]
# Scan the shipped integration only; tests use asserts/fixtures by design.
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.essex_suffolk_water --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components/essex_suffolk_water"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
